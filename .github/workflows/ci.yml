name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vwo
          POSTGRES_PASSWORD: vwo
          POSTGRES_DB: vwo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vwo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://vwo:vwo@localhost:5432/vwo_test
      DATABASE_URL: postgres://vwo:vwo@localhost:5432/vwo_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @vwo/web build
